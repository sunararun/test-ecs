image: maven:3-eclipse-temurin-21

clone:
  depth: full              # SonarQube Cloud scanner needs the full history to assign issues properly

definitions:
  caches:
    sonar: ~/.sonar/cache  # Caching SonarQube Cloud artifacts will speed up your build
  steps:
    - step: &build-test-sonarcloud
        name: Build, test and analyze on SonarQube Cloud
        caches:
          - maven
          - sonar
        script:
          # Securely appends token and forces the build to wait and fail if the Quality Gate fails
          - mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true
        artifacts:
          - target/**
        # Parses test results and code coverage metrics into Bitbucket UI tabs
        reports:
          surefire: 'target/surefire-reports/*.xml'
          jacoco: 'target/site/jacoco/jacoco.xml'

pipelines:                 
  branches:
    main:
      - step: *build-test-sonarcloud
  pull-requests:
    '**':
      - step: *build-test-sonarcloud

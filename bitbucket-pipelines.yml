image: maven:3-eclipse-temurin-21

clone:
  depth: full

definitions:
  caches:
    sonar: ~/.sonar/cache
  steps:
    - step: &build-test-sonarcloud
        name: Build, test and analyze on SonarQube Cloud
        caches:
          - maven
          - sonar
        script:
          - mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true
        artifacts:
          - target/**
        reports:
          surefire: 'target/surefire-reports/*.xml'
          jacoco: 'target/site/jacoco/jacoco.xml'

    - step: &trigger-jenkins
        name: Trigger Jenkins Build & Deploy
        script:
          - echo "Sonar Check Passed! Triggering Jenkins..."
          # Calls the Jenkins API to start the build. It passes the current Git commit hash so Jenkins builds the exact same code.
          - |
            - curl -X POST "https://${JENKINS_USER}:${JENKINS_TOKEN}@${JENKINS_URL}/job/${JENKINS_JOB_NAME}/build"

pipelines:
  branches:
    main:
      - step: *build-test-sonarcloud
      - step: *trigger-jenkins       # Runs only if Sonar step succeeds
  pull-requests:
    '**':
      - step: *build-test-sonarcloud
      # Typically, you do not want to deploy Pull Requests, so we omit Jenkins here.

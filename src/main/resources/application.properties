# 1. Name your microservice
spring.application.name=first-ecs

# 2. Fix the formatting layout for log correlation
logging.pattern.level=[%X{traceId},%X{spanId}] Tenant:%X{tenantId} %5p

# 3. Enable the OpenTelemetry Log Bridge to populate trace IDs in your logs
management.opentelemetry.logs.enabled=true

# 4. Turn off ALL background network exporters completely to save resources locally
management.otlp.metrics.export.enabled=false
management.otlp.tracing.export.enabled=false
management.otlp.logs.export.enabled=false

# 5. Force the tracer to sample 100% of local requests
management.tracing.sampling.probability=1.0

logging.structured.format.console=ecs
# Inject container infrastructure tags into the tracing footprint
management.opentelemetry.resource-attributes.environment=development
management.opentelemetry.resource-attributes.service.version=0.0.1-SNAPSHOT
management.opentelemetry.resource-attributes.deployment.runtime=local-machine

#OTEL_EXPORTER_OTLP_ENDPOINT = https://ingest.au0.observability.splunkcloud.com:443


spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
server.port=5000
# app.service.url= ${APP_SERVICE_URL:http://localhost:5000/mock/comments}
app.service.url= https://jsonplaceholder.typicode.com/comments

otel.service.name=first-ecs
otel.javaagent.debug=true
otel.traces.exporter=logging
otel.metrics.exporter=none
otel.logs.exporter=none
